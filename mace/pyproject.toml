[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lapis-mace-inference"
version = "0.1.0"
description = "MACE MH1 inference using Lapis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "ase>=3.23"]

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["mace_inference", "mace_inference_ase", "structure_io"]
